<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Umbral - Diamond Portal Editorial | Nadia & Erick</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Tipografía Editorial de Alta Costura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Sistema Cromático Oficial */
      --bg-marfil: #F4F0EA;
      --bronce-mate: #A67C52;
      --bronce-luz: #C59B72;
      --bronce-sombra: #5E3F20;
      --carbon-suave: #1A1A1A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-marfil);
      color: var(--carbon-suave);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1600px;
    }

    /* Halo ambiental fotográfico */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 198, 193, 0.4) 0%, rgba(244, 240, 234, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      transform: scale(0.9);
      z-index: 1;
    }

    /* Contenedor Maestro para Animación Global */
    .hero-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Teatro de Identidad (Vectores) */
    .identity-stage {
      position: relative;
      width: 100%;
      height: 440px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 40px rgba(107, 76, 45, 0.18));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }

    /* Bloque Tipográfico Editorial */
    .editorial-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .chapter-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.45em;
      color: var(--bronce-mate);
      margin-bottom: 0.8rem;
      opacity: 0;
      transform: translateY(12px);
    }

    .couple-names {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 3.4rem;
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: var(--carbon-suave);
      margin-bottom: 0.9rem;
      opacity: 0;
      transform: translateY(20px);
    }

    .wedding-meta {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--carbon-suave);
      opacity: 0;
      transform: translateY(12px);
    }

    .line-separator {
      width: 40px;
      height: 1px;
      background: var(--bronce-mate);
      margin: 1.2rem auto 0;
      opacity: 0;
      transform: scaleX(0);
    }
  </style>
</head>

  <script>
    window.addEventListener("load", () => {
      
      // Coordenadas absolutas del centro del lienzo y el beso
      const center = 500;
      const radiusCut = 1400; // Suficiente para limpiar la pantalla sin ser colosal
      const radiusEcho = 1480; 

      // Puntos iniciales del rombo (Cerrado en el centro del beso)
      const endPolyCut = `${center},${center - radiusCut} ${center + radiusCut},${center} ${center},${center + radiusCut} ${center - radiusCut},${center}`;
      const endPolyEcho = `${center},${center - radiusEcho} ${center + radiusEcho},${center} ${center},${center + radiusEcho} ${center - radiusEcho},${center}`;

      // Configurar transformaciones de inicio
      gsap.set("#couple-layer, #dna-layer", { transformOrigin: "500px 500px" });
      gsap.set("#dna-layer", { scale: 0.88 });

      // Coreografía combinada (Vectores + Editorial)
      const tl = gsap.timeline({ delay: 0.4 });

      tl
        // 1. CORTE DE DIAMANTE
        .to(".diamond-shape:not(#echo-diamond)", {
          attr: { points: endPolyCut },
          duration: 2.8,
          ease: "power3.inOut"
        }, 0)
        
        .to("#cutting-diamond", {
          strokeWidth: 0,
          duration: 2.8,
          ease: "power3.inOut"
        }, 0)
        
        .to("#echo-diamond", {
          attr: { points: endPolyEcho },
          strokeWidth: 0,
          opacity: 0,
          duration: 2.8,
          ease: "power3.out"
        }, 0)

        // 2. EFECTO PARALLAX
        .to("#couple-layer", {
          scale: 1.15,
          duration: 2.8,
          ease: "power3.inOut"
        }, 0)
        .to("#dna-layer", {
          scale: 1,
          duration: 2.8,
          ease: "power3.inOut"
        }, 0)

        // 3. REVELACIÓN ESCALONADA DEL TEXTO EDITORIAL
        .to(".chapter-tag", {
          opacity: 0.85,
          y: 0,
          duration: 1.8,
          ease: "power3.out"
        }, "-=2.0")
        .to(".couple-names", {
          opacity: 1,
          y: 0,
          duration: 2.4,
          ease: "power4.out"
        }, "-=2.2")
        .to(".wedding-meta", {
          opacity: 0.75,
          y: 0,
          duration: 2.0,
          ease: "power3.out"
        }, "-=2.4")
        .to(".line-separator", {
          opacity: 0.6,
          scaleX: 1,
          duration: 1.5,
          ease: "power2.out"
        }, "-=2.0")

        // 4. LEVITACIÓN GLOBAL DEL HERO COMPLETO
        .to("#heroContainer", {
          y: -12,
          duration: 4.8,
          repeat: -1,
