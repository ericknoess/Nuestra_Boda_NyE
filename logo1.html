<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo I: El Umbral | Nadia & Erick</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Tipografía Editorial de Alta Costura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Paleta Maestra Oficial (Concepto 01: Estructura Pétalo) */
      --bg-marfil: #F4F0EA;
      --rosa-palo: #E6C6C1;
      --bronce-mate: #A67C52;
      --bronce-luz: #C59B72;
      --bronce-sombra: #5E3F20;
      --carbon-suave: #1A1A1A;
      --negro-obsidiana: #0E0F12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-marfil);
      color: var(--carbon-suave);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1600px;
    }

    /* Halo de Iluminación Fotográfica */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 198, 193, 0.4) 0%, rgba(244, 240, 234, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      transform: scale(0.85);
      z-index: 1;
    }

    /* Contenedor Maestro Hero (Grand Folio Edition) */
    .hero-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateZ(-140px) translateY(35px) rotateX(4deg);
    }

    /* Teatro Visual para la Superposición de Logos */
    .identity-stage {
      position: relative;
      width: 280px;
      height: 340px;
      margin-bottom: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }

    /* 1. Silueta de los novios con micro-delineado en negro obsidiana */
    #couple-silhouette {
      fill: url(#bronceCoupleGradient);
      stroke: var(--negro-obsidiana);
      stroke-width: 0.55px;
      stroke-opacity: 0.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 15px 30px rgba(14, 15, 18, 0.18)) blur(14px);
      opacity: 0;
      transform: scale(0.94);
      transform-origin: center center;
    }

    /* 2. The Molecular Axis (ADN) */
    #biotech-monogram {
      fill: url(#bronceDNAGradient);
      stroke: var(--bronce-sombra);
      stroke-width: 0.35px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 20px 45px rgba(166, 124, 82, 0.32)) blur(16px);
      opacity: 0;
      transform: scale(1.08);
      transform-origin: center center;
    }

    /* Bloque Tipográfico Editorial */
    .editorial-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .chapter-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.45em;
      color: var(--bronce-mate);
      margin-bottom: 0.8rem;
      opacity: 0;
      transform: translateY(10px);
    }

    .couple-names {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 3.4rem;
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: var(--carbon-suave);
      margin-bottom: 0.9rem;
      opacity: 0;
      transform: translateY(18px);
    }

    .wedding-meta {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--carbon-suave);
      opacity: 0;
      transform: translateY(10px);
    }

    .line-separator {
      width: 40px;
      height: 1px;
      background: var(--bronce-mate);
      margin: 1.2rem auto 0;
      opacity: 0;
      transform: scaleX(0);
    }
  </style>
</head>

  <script>
    window.addEventListener("load", () => {
      
      const tl = gsap.timeline({ delay: 0.3 });

      tl
        // 1. Aterrizaje 3D de la cámara sobre el lienzo Marfil
        .to("#heroContainer", {
          opacity: 1,
          z: 0,
          y: 0,
          rotationX: 0,
          duration: 2.8,
          ease: "power4.out"
        })
        .to("#ambientLight", {
          scale: 1.15,
          duration: 3.5,
          ease: "sine.out"
        }, 0)

        // 2. Revelado fotográfico (Focus Pull) de la silueta de los novios
        .to("#couple-silhouette", {
          opacity: 1,
          filter: "drop-shadow(0 15px 30px rgba(14, 15, 18, 0.18)) blur(0px)",
          scale: 1,
          duration: 3.2,
          ease: "power3.out"
        }, 0.4)

        // 3. Momento de contemplación y expansión de la luz
        .to("#ambientLight", {
          scale: 1.35,
          opacity: 0.85,
          duration: 1.6,
          ease: "power2.inOut"
        }, "+=1.0")

        // 4. Disolución de la silueta hacia la luz
        .to("#couple-silhouette", {
          opacity: 0,
          filter: "drop-shadow(0 0 45px rgba(200, 159, 119, 0.75)) blur(18px)",
          scale: 1.07,
          duration: 2.4,
          ease: "power2.inOut"
        }, "<0.1")

        // 5. Cristalización de The Molecular Axis (ADN)
        .to("#biotech-monogram", {
          opacity: 1,
          filter: "drop-shadow(0 20px 40px rgba(166, 124, 82, 0.32)) blur(0px)",
          scale: 1,
          duration: 2.8,
          ease: "power3.out"
        }, "-=1.6")

        // 6. Revelación escalonada del bloque editorial
        .to(".chapter-tag", {
          opacity: 0.85,
          y: 0,
          duration: 1.8,
          ease: "power3.out"
        }, "-=1.4")
        .to(".couple-names", {
          opacity: 1,
          y: 0,
          duration: 2.4,
          ease: "power4.out"
        }, "-=1.6")
        .to(".wedding-meta", {
          opacity: 0.75,
          y: 0,
          duration: 2.0,
          ease: "power3.out"
        }, "-=1.8")
        .to(".line-separator", {
          opacity: 0.6,
          scaleX: 1,
          duration: 1.5,
          ease: "power2.out"
        }, "-=1.4")

        // 7. Levitación constante (Atmósfera de Galería de Arte)
        .to("#heroContainer", {
          y: -8,
          duration: 4.6,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut"
        });
    });
  </script>
</body>
</html>
