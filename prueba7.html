<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototipo Interactivo | El Tiempo y Las Coordenadas - V5.9</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-marfil: #F4F0EA;
      --bronce-mate: #A67C52;
      --carbon-suave: #1A1A1A;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-marfil); 
      color: var(--carbon-suave);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    .spacer-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0.3;
    }

    #chapter-3 {
      position: relative;
      width: 100%;
      height: 450vh; /* Pista aún más larga para dar pausas dramáticas entre cada texto */
    }

    .sticky-container {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* TEXTURAS FOTOGRÁFICAS */
    .ethereal-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Filtro tonal bronce para mantener la atmósfera */
      filter: grayscale(100%) sepia(20%) contrast(120%);
      opacity: 0; 
      z-index: 0;
    }

    /* EL HALO INVISIBLE: Protege el texto en el centro sin crear rectángulos */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(244,240,234,0.85) 0%, rgba(244,240,234,0.4) 40%, rgba(244,240,234,0.1) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--bronce-mate);
      position: absolute;
      top: 15%;
      z-index: 10;
    }

    /* CONTENEDOR DE TEXTOS */
    .monumental-text-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .info-layer {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      /* Sombra levísima que envuelve las letras para despegarla de las fotos */
      text-shadow: 0 0 40px rgba(244, 240, 234, 1), 0 0 15px rgba(244, 240, 234, 0.8);
    }

    .date-display {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 10vw, 7rem);
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--carbon-suave);
    }

    .phase-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--bronce-mate);
      margin-bottom: 1rem;
    }

    .location-title {
      font-family: 'Cormorant Garamond', serif; 
      font-size: clamp(2.5rem, 6vw, 4rem); 
      font-weight: 300;
      color: var(--carbon-suave);
      line-height: 1.2;
    }

    /* Estados iniciales */
    #layer-ceremonia { opacity: 0; transform: translateY(40px); }
    #layer-recepcion { opacity: 0; transform: translateY(40px); }

  </style>
</head>
<body>

  <div class="spacer-section">
    <p style="font-family: 'Montserrat'; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.7rem;">Scroll hacia Capítulo III</p>
  </div>

  <section id="chapter-3">
    <div class="sticky-container">
      
      <img src="iglesia.jpeg" alt="Iglesia" class="ethereal-bg" id="bg-iglesia">
      <img src="jardin.jpeg" alt="Jardín" class="ethereal-bg" id="bg-jardin">
      <div class="vignette-overlay"></div>

      <div class="chapter-tag" id="ch-tag">Capítulo III &bull; Coordenadas</div>

      <div class="monumental-text-container">
        
        <!-- Capa 1: Fecha -->
        <div class="info-layer" id="layer-fecha">
          <div class="date-display">21 . 11 . 2026</div>
        </div>

        <!-- Capa 2: Ceremonia (Puras Letras) -->
        <div class="info-layer" id="layer-ceremonia">
          <div class="phase-tag">La Ceremonia</div>
          <div class="location-title">Iglesia Principal</div>
          <div style="font-family: 'Montserrat', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronce-mate); margin-top: 1rem;">Ixtapan de la Sal</div>
        </div>

        <!-- Capa 3: Recepción (Puras Letras) -->
        <div class="info-layer" id="layer-recepcion">
          <div class="phase-tag">La Celebración</div>
          <div class="location-title">Finca El Encanto</div>
          <div style="font-family: 'Montserrat', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronce-mate); margin-top: 1rem;">Recepción y Banquete</div>
        </div>

      </div>
    </div>
  </section>

  <div class="spacer-section">
    <p style="font-family: 'Montserrat'; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.7rem;">Continuación hacia el Capítulo IV</p>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#chapter-3",
        start: "top top",      
        end: "+=400%",         // Pista sumamente extendida para que cada acto respire
        scrub: 1,              
        pin: true              
      }
    });

    // MATEMÁTICA ESTRICTA DE LA LÍNEA DE TIEMPO
    tl
      // ACTO 1: Inicia la fecha y entra la atmósfera de la iglesia (0 a 1)
      .to("#bg-iglesia", { opacity: 0.25, duration: 1 }, 0)
      
      // ACTO 2: La Fecha SE RETIRA (1 a 2)
      .to("#layer-fecha", { opacity: 0, y: -40, duration: 1 }, 1)
      
      // ACTO 3: La Ceremonia ENTRA sola, una vez que la fecha ya no está (2 a 3)
      .to("#layer-ceremonia", { opacity: 1, y: 0, duration: 1 }, 2)
      
      // ACTO 4: La Ceremonia SE RETIRA junto con la iglesia (4 a 5)
      .to("#layer-ceremonia", { opacity: 0, y: -40, duration: 1 }, 4)
      .to("#bg-iglesia", { opacity: 0, duration: 1 }, 4)
      
      // ACTO 5: Entra el Jardín y luego la Recepción (5 a 6.5)
      .to("#bg-jardin", { opacity: 0.25, duration: 1 }, 5)
      .to("#layer-recepcion", { opacity: 1, y: 0, duration: 1 }, 5.5)
      
      // MOVIMIENTO DE FONDO CONTINUO (Se reproduce independientemente)
      .to("#bg-iglesia", { scale: 1.06, duration: 5, ease: "none" }, 0)
      .to("#bg-jardin", { scale: 1.06, duration: 4.5, ease: "none" }, 5)
      
      // ACTO FINAL: Salida limpia hacia el siguiente capítulo (8 a 9)
      .to("#layer-recepcion", { opacity: 0, y: -40, duration: 1 }, 8)
      .to("#bg-jardin", { opacity: 0, duration: 1 }, 8)
      .to("#ch-tag", { opacity: 0, duration: 1 }, 8);

  </script>
</body>
</html>
